# ---------- fragments ----------

fragment EnrollmentFields on Enrollment {
  pathId
  status
  progress
  enrolledAt
  completedAt
  nextLessonId
}

fragment PathCard on Path {
  id
  slug
  title
  description
  difficulty
  tags
  status
  estimatedMinutes
  updatedAt
  enrollment {
    ...EnrollmentFields
  }
}

fragment LessonSummary on Lesson {
  id
  moduleId
  title
  type
  position
  estimatedMinutes
  completed
}

fragment PathTree on Path {
  ...PathCard
  createdAt
  modules {
    id
    pathId
    title
    descriptionMd
    position
    myProgress {
      status
      progress
      completedAt
    }
    lessons {
      ...LessonSummary
    }
  }
}

# ---------- learner queries ----------

query Me {
  me {
    userId
    role
    canAuthor
  }
}

query Catalogue($difficulty: Difficulty, $tag: String, $search: String) {
  paths(difficulty: $difficulty, tag: $tag, search: $search) {
    ...PathCard
  }
}

query PathBySlug($slug: String!) {
  path(slug: $slug) {
    ...PathTree
  }
}

query PathById($id: ID!) {
  pathById(id: $id) {
    ...PathTree
  }
}

query LessonById($id: ID!) {
  lesson(id: $id) {
    ...LessonSummary
    contentMd
    videoUrl
  }
}

query MyEnrollments {
  myEnrollments {
    ...PathCard
  }
}

# ---------- learner mutations ----------

mutation Enroll($pathId: ID!) {
  enroll(pathId: $pathId) {
    ...EnrollmentFields
  }
}

mutation DropPath($pathId: ID!) {
  dropPath(pathId: $pathId) {
    ...EnrollmentFields
  }
}

mutation CompleteLesson($lessonId: ID!) {
  completeLesson(lessonId: $lessonId) {
    id
    completed
  }
}

# ---------- author mutations ----------

mutation UpsertPath($input: PathInput!) {
  upsertPath(input: $input) {
    ...PathCard
  }
}

mutation UpsertModule($input: ModuleInput!) {
  upsertModule(input: $input) {
    id
    pathId
    title
    descriptionMd
    position
  }
}

mutation UpsertLesson($input: LessonInput!) {
  upsertLesson(input: $input) {
    ...LessonSummary
    contentMd
    videoUrl
  }
}

mutation ReorderModules($pathId: ID!, $orderedIds: [ID!]!) {
  reorderModules(pathId: $pathId, orderedIds: $orderedIds) {
    id
  }
}

mutation ReorderLessons($moduleId: ID!, $orderedIds: [ID!]!) {
  reorderLessons(moduleId: $moduleId, orderedIds: $orderedIds) {
    id
  }
}

mutation PublishPath($id: ID!, $published: Boolean) {
  publishPath(id: $id, published: $published) {
    id
    status
  }
}

mutation ArchivePath($id: ID!) {
  archivePath(id: $id) {
    id
    status
  }
}

mutation DeleteModule($id: ID!) {
  deleteModule(id: $id)
}

mutation DeleteLesson($id: ID!) {
  deleteLesson(id: $id)
}
