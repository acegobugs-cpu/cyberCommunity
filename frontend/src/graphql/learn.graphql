# ---------- fragments ----------

fragment EnrollmentFields on Enrollment {
  pathId
  status
  progress
  enrolledAt
  completedAt
  nextLessonId
}

fragment PathCard on Path {
  id
  slug
  title
  description
  difficulty
  tags
  status
  estimatedMinutes
  updatedAt
  enrollment {
    ...EnrollmentFields
  }
}

fragment LessonSummary on Lesson {
  id
  moduleId
  title
  type
  position
  estimatedMinutes
  completed
}

fragment PathTree on Path {
  ...PathCard
  createdAt
  modules {
    id
    title
    descriptionMd
    myProgress {
      status
      progress
      completedAt
    }
    lessons {
      ...LessonSummary
    }
  }
}

# ---------- learner queries ----------

query Me {
  me {
    userId
    role
    canAuthor
  }
}

query Catalogue($difficulty: Difficulty, $tag: String, $search: String) {
  paths(difficulty: $difficulty, tag: $tag, search: $search) {
    ...PathCard
  }
}

query PathBySlug($slug: String!) {
  path(slug: $slug) {
    ...PathTree
  }
}

query PathById($id: ID!) {
  pathById(id: $id) {
    ...PathTree
  }
}

query LessonById($id: ID!) {
  lesson(id: $id) {
    ...LessonSummary
    contentMd
    videoUrl
  }
}

query MyEnrollments {
  myEnrollments {
    ...PathCard
  }
}

# ---------- learner mutations ----------

mutation Enroll($pathId: ID!) {
  enroll(pathId: $pathId) {
    ...EnrollmentFields
  }
}

mutation DropPath($pathId: ID!) {
  dropPath(pathId: $pathId) {
    ...EnrollmentFields
  }
}

mutation CompleteLesson($lessonId: ID!, $pathId: ID) {
  completeLesson(lessonId: $lessonId, pathId: $pathId) {
    id
    completed
  }
}

# ---------- author mutations ----------

mutation UpsertPath($input: PathInput!) {
  upsertPath(input: $input) {
    ...PathCard
  }
}

mutation UpsertModule($input: ModuleInput!) {
  upsertModule(input: $input) {
    id
    title
    descriptionMd
  }
}

query ModulePicker($search: String) {
  modules(search: $search) {
    id
    title
    descriptionMd
  }
}

mutation AddModuleToPath($pathId: ID!, $moduleId: ID!) {
  addModuleToPath(pathId: $pathId, moduleId: $moduleId) {
    id
  }
}

mutation RemoveModuleFromPath($pathId: ID!, $moduleId: ID!) {
  removeModuleFromPath(pathId: $pathId, moduleId: $moduleId) {
    id
  }
}

mutation UpsertLesson($input: LessonInput!) {
  upsertLesson(input: $input) {
    ...LessonSummary
    contentMd
    videoUrl
  }
}

mutation ReorderModules($pathId: ID!, $orderedIds: [ID!]!) {
  reorderModules(pathId: $pathId, orderedIds: $orderedIds) {
    id
  }
}

mutation ReorderLessons($moduleId: ID!, $orderedIds: [ID!]!) {
  reorderLessons(moduleId: $moduleId, orderedIds: $orderedIds) {
    id
  }
}

mutation PublishPath($id: ID!, $published: Boolean) {
  publishPath(id: $id, published: $published) {
    id
    status
  }
}

mutation ArchivePath($id: ID!) {
  archivePath(id: $id) {
    id
    status
  }
}

mutation DeleteModule($id: ID!) {
  deleteModule(id: $id)
}

mutation DeleteLesson($id: ID!) {
  deleteLesson(id: $id)
}

# ---------- roadmaps (L3) ----------

fragment RoadMapCard on RoadMap {
  id
  slug
  title
  descriptionMd
  status
  progress
  updatedAt
}

fragment RoadMapTree on RoadMap {
  ...RoadMapCard
  createdAt
  items {
    id
    position
    groupType
    isRequired
    progress
    item {
      __typename
      ... on Path {
        ...PathCard
      }
      ... on Module {
        id
        title
        descriptionMd
        paths {
          id
          slug
          title
          status
        }
        myProgress {
          status
          progress
        }
      }
    }
  }
}

query Roadmaps($search: String) {
  roadmaps(search: $search) {
    ...RoadMapCard
  }
}

query RoadmapBySlug($slug: String!) {
  roadmap(slug: $slug) {
    ...RoadMapTree
  }
}

query RoadmapById($id: ID!) {
  roadmapById(id: $id) {
    ...RoadMapTree
  }
}

query MyRoadmaps {
  myRoadmaps {
    ...RoadMapCard
  }
}

mutation UpsertRoadmap($input: RoadMapInput!) {
  upsertRoadmap(input: $input) {
    ...RoadMapCard
  }
}

mutation SetRoadmapItems($roadmapId: ID!, $items: [RoadMapItemInput!]!) {
  setRoadmapItems(roadmapId: $roadmapId, items: $items) {
    id
  }
}

mutation PublishRoadmap($id: ID!, $published: Boolean) {
  publishRoadmap(id: $id, published: $published) {
    id
    status
  }
}

mutation ArchiveRoadmap($id: ID!) {
  archiveRoadmap(id: $id) {
    id
    status
  }
}

mutation DeleteRoadmap($id: ID!) {
  deleteRoadmap(id: $id)
}
