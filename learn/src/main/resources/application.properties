server.port=9002

# 4.3 Configure database connection via environment variables for each service
# Use the environment variables supplied by the Docker Compose file
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/multi_service_db?user=appuser_dev&password=dev_secure_password}
spring.datasource.username=${POSTGRES_USER:appuser_dev}
spring.datasource.password=${POSTGRES_PASSWORD:dev_secure_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable auto DDL/Migration tools for now, as we will manage schema manually/externally
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.graphql.graphiql.enabled=true

# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

identity.base-url=http://localhost:8082
INTERNAL_GATEWAY_SECRET=INTERNAL_GATEWAY_SECRETINTERNAL_GATEWAY_SECRET
